# Step 3: neural baselines (run on Kaggle GPUs). Read by src/neural/*.py.
# Same tasks as step 2 (configs/step2.yaml, section `tasks`).

protocol:
  n_trials: 20             # Optuna trials per (model, task), objective = macro F1 on val
  tuning_seed: 42          # TPE sampler seed and training seed during tuning
  eval_seeds: [1, 2, 3, 4, 5]
  save_model_seed: 1       # weights of this seed are kept for the CPU latency notebook
  fp16: true               # torch.autocast(float16) + GradScaler
  deterministic: true      # torch.use_deterministic_algorithms(True, warn_only=True), CUBLAS workspace

smoke:                     # quick functional test + timing, see scripts/estimate_gpu.py
  n_trials: 1
  eval_seeds: [1]
  data_fraction: 0.05      # stratified subsample of train, val and test (seed 0)

# Parameter spec as in step 2: {type: float, low, high, log} | {type: int, ...} | {type: categorical, choices}
models:
  textcnn:
    kind: textnn
    space:
      lr:           {type: float, low: 0.0001, high: 0.003, log: true}
      batch_size:   {type: categorical, choices: [32, 64, 128]}
      embed_dim:    {type: categorical, choices: [100, 200, 300]}
      num_filters:  {type: categorical, choices: [64, 128, 256]}
      kernel_sizes: {type: categorical, choices: ["2,3,4", "3,4,5"]}
      dropout:      {type: float, low: 0.1, high: 0.5}
      max_len:      {type: categorical, choices: [64, 128]}
      min_freq:     {type: categorical, choices: [1, 2]}
    fixed: {max_epochs: 20, patience: 3, eval_batch_size: 512}
  bilstm:
    kind: textnn
    space:
      lr:           {type: float, low: 0.0001, high: 0.003, log: true}
      batch_size:   {type: categorical, choices: [32, 64, 128]}
      embed_dim:    {type: categorical, choices: [100, 200, 300]}
      hidden_size:  {type: categorical, choices: [64, 128, 256]}
      num_layers:   {type: categorical, choices: [1, 2]}
      dropout:      {type: float, low: 0.1, high: 0.5}
      max_len:      {type: categorical, choices: [64, 128]}
      min_freq:     {type: categorical, choices: [1, 2]}
    fixed: {max_epochs: 20, patience: 3, eval_batch_size: 512}
  distilbert:
    kind: transformer
    checkpoint: distilbert-base-uncased
    checkpoint_by_task: {moz_binary: distilbert-base-multilingual-cased}
    space:
      lr:           {type: float, low: 0.00001, high: 0.0001, log: true}
      batch_size:   {type: categorical, choices: [16, 32]}
      weight_decay: {type: categorical, choices: [0.0, 0.01]}
      warmup_ratio: {type: categorical, choices: [0.0, 0.06, 0.1]}
    fixed: {max_epochs: 5, patience: 2, max_len: 128, grad_clip: 1.0, eval_batch_size: 128}
  bert:
    kind: transformer
    checkpoint: bert-base-uncased
    checkpoint_by_task: {moz_binary: bert-base-multilingual-cased}
    space:
      lr:           {type: float, low: 0.00001, high: 0.0001, log: true}
      batch_size:   {type: categorical, choices: [16, 32]}
      weight_decay: {type: categorical, choices: [0.0, 0.01]}
      warmup_ratio: {type: categorical, choices: [0.0, 0.06, 0.1]}
    fixed: {max_epochs: 5, patience: 2, max_len: 128, grad_clip: 1.0, eval_batch_size: 128}
  qwen_fewshot:
    kind: llm
    checkpoint: Qwen/Qwen2.5-7B-Instruct
    prompt_file: configs/llm_prompt.yaml
    # No tuning: the prompt is fixed; each eval seed draws a different set of shots.
    fixed: {n_shots: 8, load_in_4bit: true, bnb_4bit_quant_type: nf4, compute_dtype: float16,
            max_new_tokens: 6, batch_size: 8, checkpoint_every_batches: 50}
