# Kaggle kernels for steps 2-4c. scripts/make_kernels.py writes kaggle/kernels/<name>/.
owner: shapok
datasets: [smishfuse-data, smishfuse-code, smishfuse-state]

pip:
  # CPU notebooks re-run step-2 code: same versions as requirements.txt.
  cpu: [scikit-learn==1.9.1, scipy==1.17.1, numpy==2.4.6, pandas==3.1.0, optuna==5.0.0, xgboost==3.2.0,
        pyyaml==6.0.3, joblib==1.6.0]
  # pip: requirements -> every pin of requirements.txt (step 4b and later, see README decision 13).
  # GPU notebooks keep Kaggle's torch/transformers; only missing packages are installed.
  gpu: [optuna, bitsandbytes, accelerate]
  # Latency session: step-2 pipelines are re-fitted, so pin the step-2 versions of sklearn/xgboost.
  latency: [scikit-learn==1.9.1, scipy==1.17.1, xgboost==3.2.0, joblib==1.6.0, optuna, bitsandbytes, accelerate]
  # Step 4a: step-2 sklearn versions (LogReg / LinearSVM re-fitted) + spell checker for the features.
  fusion: [scikit-learn==1.9.1, scipy==1.17.1, xgboost==3.2.0, joblib==1.6.0, optuna, pyspellchecker==0.8.3]

kernels:
  smishfuse-svm-cpu:
    accelerator: none
    pip: cpu
    spec: {kind: classic, models: [linear_svm]}

  # Step 4c (README decision 14): the remaining step-2 models on Kaggle CPU, same procedure as
  # smishfuse-svm-cpu (20 Optuna trials on val, 5 seeds on test), so every final number is from Kaggle.
  smishfuse-classic-cpu:
    accelerator: none
    pip: cpu
    spec: {kind: classic, models: [logreg, random_forest, xgboost]}

  smishfuse-smoke:
    accelerator: NvidiaTeslaT4
    pip: gpu
    spec:
      kind: neural
      mode: smoke
      queues:
        - [{task: mendeley_3class, model: textcnn}, {task: mendeley_binary, model: textcnn},
           {task: moz_binary, model: textcnn}, {task: super_sms_clean_binary, model: textcnn},
           {task: mendeley_3class, model: bilstm}, {task: mendeley_binary, model: bilstm},
           {task: moz_binary, model: bilstm}, {task: super_sms_clean_binary, model: bilstm},
           {task: mendeley_3class, model: distilbert}, {task: mendeley_binary, model: distilbert},
           {task: moz_binary, model: distilbert}, {task: super_sms_clean_binary, model: distilbert},
           {task: mendeley_3class, model: bert}, {task: mendeley_binary, model: bert},
           {task: moz_binary, model: bert}, {task: super_sms_clean_binary, model: bert}]
        - [{task: mendeley_3class, model: qwen_fewshot}, {task: mendeley_binary, model: qwen_fewshot},
           {task: moz_binary, model: qwen_fewshot}, {task: super_sms_clean_binary, model: qwen_fewshot}]

  # Second smoke test: session deadline + resume + GPU split + LLM prefix-cache check.
  # Run A with budget_hours 0.07 (deadline hits mid-tuning and mid-LLM-seed), then
  # run B with budget_hours 1.0 resuming from the state of run A.
  smishfuse-smoke2:
    accelerator: NvidiaTeslaT4
    pip: gpu
    spec:
      kind: neural
      mode: smoke
      budget_hours: 1.0
      overrides: {n_trials: 3, eval_seeds: [1, 2]}
      queues:
        - [{task: super_sms_clean_binary, model: bert}, {task: moz_binary, model: textcnn}]
        - [{task: super_sms_clean_binary, model: qwen_fewshot},
           {task: mendeley_3class, model: qwen_fewshot, check_cache: true},
           {task: mendeley_binary, model: qwen_fewshot, check_cache: true},
           {task: moz_binary, model: qwen_fewshot, check_cache: true},
           {task: super_sms_clean_binary, model: qwen_fewshot, check_cache: true}]

  # ---- Full step-3 run (approved 2026-10-29). Each worker stops taking new work after
  # budget_hours; a re-push continues from the smishfuse-state dataset.
  smishfuse-full-bert-distil:
    accelerator: NvidiaTeslaT4
    pip: gpu
    spec:
      kind: neural
      mode: full
      budget_hours: 8.5
      queues:
        - [{task: super_sms_clean_binary, model: bert}]
        - [{task: super_sms_clean_binary, model: distilbert}, {task: mendeley_3class, model: distilbert},
           {task: mendeley_binary, model: distilbert}, {task: moz_binary, model: distilbert}]

  smishfuse-full-llm-bert:
    accelerator: NvidiaTeslaT4
    pip: gpu
    spec:
      kind: neural
      mode: full
      budget_hours: 8.5
      queues:
        - [{task: super_sms_clean_binary, model: qwen_fewshot, seeds: [1, 2, 3]},
           {task: mendeley_3class, model: qwen_fewshot}, {task: mendeley_binary, model: qwen_fewshot}]
        - [{task: super_sms_clean_binary, model: qwen_fewshot, seeds: [4, 5]},
           {task: moz_binary, model: qwen_fewshot},
           {task: mendeley_3class, model: bert}, {task: mendeley_binary, model: bert},
           {task: moz_binary, model: bert}]

  smishfuse-full-rnn-cnn:
    accelerator: NvidiaTeslaT4
    pip: gpu
    spec:
      kind: neural
      mode: full
      budget_hours: 8.5
      queues:
        - [{task: super_sms_clean_binary, model: bilstm}]
        - [{task: mendeley_3class, model: bilstm}, {task: mendeley_binary, model: bilstm},
           {task: moz_binary, model: bilstm}, {task: mendeley_3class, model: textcnn},
           {task: mendeley_binary, model: textcnn}, {task: moz_binary, model: textcnn},
           {task: super_sms_clean_binary, model: textcnn}]

  # Unified latency / size measurement of all step-2 and step-3 models in ONE session.
  # CPU models with 1 thread; Qwen on the T4. Kernel sources provide the seed-1 weights
  # (add continuation kernels here if a full kernel needed a second session).
  smishfuse-latency:
    accelerator: NvidiaTeslaT4
    pip: latency
    # smishfuse-full-llm-bert (BERT on mendeley_3class / mendeley_binary / moz_binary) cannot be a kernel
    # source because its run ended with ERROR status; src/latency.py re-trains those seed-1 models.
    kernel_sources: [shapok/smishfuse-full-bert-distil, shapok/smishfuse-full-rnn-cnn]
    spec: {kind: latency}

  # Continuation session for the unfinished work of two full kernels:
  # * smishfuse-full-llm-bert: prefix-cache OOM (fixed with logits_to_keep=1); the cache check
  #   is repeated with the fix for the two affected tasks;
  # * smishfuse-full-bert-distil: BERT super_sms_clean seed 5 deferred by the session budget.
  # Finished trials/seeds are restored from both kernels' state and skipped.
  smishfuse-full-c2:
    accelerator: NvidiaTeslaT4
    pip: gpu
    spec:
      kind: neural
      mode: full
      budget_hours: 8.5
      state_from: [smishfuse-full-llm-bert, smishfuse-full-bert-distil]
      queues:
        - [{task: mendeley_3class, model: qwen_fewshot, check_cache: true},
           {task: mendeley_3class, model: qwen_fewshot}]
        - [{task: super_sms_clean_binary, model: bert},
           {task: moz_binary, model: qwen_fewshot, check_cache: true},
           {task: moz_binary, model: qwen_fewshot}]

  # ---- Step 4a: SmishFuse prototype, mendeley_3class, seed 1, val only (test not read).
  # Budget 1.5 GPU-hours; the step-3 DistilBERT seed-1 weights come from the kernel source.
  smishfuse-step4a:
    accelerator: NvidiaTeslaT4
    pip: fusion
    kernel_sources: [shapok/smishfuse-full-bert-distil]
    spec: {kind: fusion, budget_hours: 1.5}

  # ---- Step 4b: stress conditions, val only (test not read), seeds 1-3. Pinned environment:
  # all versions of requirements.txt; the worker stops if an installed version differs.
  # Budget 4 GPU-hours: no new job after budget_hours.
  smishfuse-step4b:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      budget_hours: 3.5
      queues:
        - [baseline, transfer]
        - [obfuscation, low_data]

  # ---- Step 4c: SmishFuse v2 (char branch + TRAIN-type augmentation) vs baselines, val only, seeds 1-3.
  # Pinned environment as in step 4b. Budget 3 GPU-hours: no new job after budget_hours.
  smishfuse-step4c:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/fusion/v2.py
      budget_hours: 2.5
      queues:
        - [smishfuse_v2_aug, smishfuse_v2, svm_char_aug, svm_char, svm_step2]
        - [distilbert_aug, distilbert, smishfuse_v1, bert]
  # Step 5a: cascade (from step-4c predictions), re-implemented published methods, duplicate
  # inflation CV; val only (inflation: train + val). Comparison after both queues.
  smishfuse-step5a:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/step5a/run.py
      budget_hours: 1.8
      queues:
        - ["published:shim2024_bert_base", "published:shim2024_distilbert_base",
           "inflation:shim2024_bert_base", "inflation:shim2024_distilbert_base"]
        - [cascade, "published:mahmud2024_cnn_bigru", "published:shim2024_roberta_base", "inflation:linear_svm",
           "inflation:logreg", "inflation:mahmud2024_cnn_bigru", "inflation:shim2024_roberta_base"]
      post: [compare]
  # Step 5a addendum (configs/step5a.yaml, setting_runs) and the rerun of the Shim et al. jobs, which
  # failed in smishfuse-step5a (label-mask bug, fixed); restores that kernel's output first.
  smishfuse-step5a-setting:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/step5a/run.py
      state_from: smishfuse-step5a
      budget_hours: 1.5   # step 5a: 3 GPU h (raised by the user); smishfuse-step5a used 1.26 h
      queues:
        - ["published:shim2024_bert_base", "published:shim2024_distilbert_base",
           "inflation:shim2024_bert_base", "inflation:shim2024_distilbert_base"]
        - ["published:shim2024_roberta_base", "inflation:shim2024_roberta_base",
           "setting:mendeley_binary:svm_char_aug", "setting:mendeley_binary:svm_char",
           "setting:mendeley_binary:svm_step2", "setting:mendeley_binary:distilbert_aug",
           "setting:mendeley_binary:distilbert", "setting:mendeley_binary:bert",
           "setting:smishing_vs_spam:svm_char_aug", "setting:smishing_vs_spam:svm_char",
           "setting:smishing_vs_spam:svm_step2", "setting:smishing_vs_spam:distilbert_aug",
           "setting:smishing_vs_spam:distilbert", "setting:smishing_vs_spam:bert"]
      post: [compare, setting_compare]

  # Step 5b (configs/final.yaml). Smoke test first: SMISHFUSE_FINAL_DRY=1, val stands in for test
  # (no test text is read), seed 1, 1 epoch, small train; output results/final_dry/.
  smishfuse-final-dry:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/final/run.py
      budget_hours: 0.3
      env: {SMISHFUSE_FINAL_DRY: "1"}
      queues:
        - ["mendeley_3class:svm_char_aug", "mendeley_3class:distilbert_aug", "mendeley_3class:smishfuse_v2",
           "mendeley_3class:textcnn", "low_data:distilbert_aug", "setting_shim:shim2024_bert_base",
           "transfer:distilbert_aug", "super_sms:svm_char_aug"]
        - ["mendeley_3class:svm_char", "mendeley_3class:distilbert", "mendeley_3class:smishfuse_v1",
           "mendeley_3class:bert", "mendeley_3class:xgboost", "low_data:svm_char_aug", "low_data:svm_char",
           "low_data:distilbert", "setting_mahmud:mahmud2024_cnn_bigru", "setting_mahmud:svm_step2",
           "setting_shim:svm_char_aug", "setting_shim:distilbert_aug", "transfer:smishfuse_v1",
           "transfer:linear_svm", "transfer:svm_char_aug", "super_sms:distilbert_aug"]
      post: []
  smishfuse-final-dry-cpu:
    accelerator: none
    pip: requirements
    kernel_sources: [shapok/smishfuse-final-dry]
    spec:
      kind: stress
      script: src/final/cpu.py
      state_from: smishfuse-final-dry
      env: {SMISHFUSE_FINAL_DRY: "1"}
      queues: [[assemble, latency]]

  smishfuse-final-3class:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/final/run.py
      budget_hours: 1.2
      queues:
        - ["mendeley_3class:distilbert_aug", "mendeley_3class:distilbert", "mendeley_3class:smishfuse_v2",
           "mendeley_3class:smishfuse_v2_noaug", "mendeley_3class:textcnn", "mendeley_3class:bilstm",
           "low_data:distilbert_aug", "low_data:distilbert", "low_data:smishfuse_v2"]
        - ["mendeley_3class:smishfuse_v1", "mendeley_3class:bert", "mendeley_3class:distilbert_step3",
           "mendeley_3class:svm_char_aug", "mendeley_3class:svm_char", "mendeley_3class:linear_svm",
           "mendeley_3class:logreg", "mendeley_3class:random_forest", "mendeley_3class:xgboost",
           "low_data:smishfuse_v1", "low_data:bert", "low_data:svm_char_aug", "low_data:svm_char",
           "low_data:linear_svm", "low_data:logreg"]
  smishfuse-final-settings:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/final/run.py
      budget_hours: 1.5
      queues:
        - ["setting_shim:shim2024_bert_base", "setting_shim:shim2024_distilbert_base",
           "setting_shim:shim2024_roberta_base", "setting_shim:svm_char_aug", "setting_shim:svm_char",
           "setting_shim:svm_step2", "setting_shim:distilbert_aug", "setting_shim:distilbert", "setting_shim:bert"]
        - ["setting_mahmud:svm_char_aug", "setting_mahmud:svm_char", "setting_mahmud:svm_step2",
           "setting_mahmud:distilbert_aug", "setting_mahmud:distilbert", "setting_mahmud:bert",
           "setting_mahmud:mahmud2024_cnn_bigru", "transfer:svm_char_aug", "transfer:svm_char",
           "transfer:distilbert_aug", "transfer:distilbert", "transfer:smishfuse_v1", "transfer:linear_svm",
           "transfer:logreg"]
  smishfuse-final-supersms:
    accelerator: NvidiaTeslaT4
    pip: requirements
    spec:
      kind: stress
      script: src/final/run.py
      budget_hours: 1.0
      queues:
        - ["super_sms:distilbert_aug@1,2,3"]
        - ["super_sms:distilbert_aug@4,5", "super_sms:svm_char_aug", "super_sms:svm_char"]
  # CPU only (no GPU quota): scoring (cascades, metrics, cost, significance) and the speed measurement.
  # Predictions: restored from the three GPU notebooks (smishfuse-state); weights: kernel sources.
  smishfuse-final-cpu:
    accelerator: none
    pip: requirements
    kernel_sources: [shapok/smishfuse-final-3class, shapok/smishfuse-final-settings]
    spec:
      kind: stress
      script: src/final/cpu.py
      state_from: [smishfuse-final-3class, smishfuse-final-settings, smishfuse-final-supersms]
      queues: [[assemble, latency]]
  # The full smishfuse-final-cpu output did not download: one zip with only the needed files (no weights).
  smishfuse-final-pack:
    accelerator: none
    pip: requirements
    kernel_sources: [shapok/smishfuse-final-cpu]
    spec:
      kind: stress
      script: src/final/pack.py
      queues: [[pack]]
  # Re-scoring after the fix of the path to the step-2/3 test predictions (assemble only; the speed
  # measurement of smishfuse-final-cpu v2 stays the one CPU session of the latency table).
  smishfuse-final-assemble:
    accelerator: none
    pip: requirements
    spec:
      kind: stress
      script: src/final/cpu.py
      state_from: [smishfuse-final-3class, smishfuse-final-settings, smishfuse-final-supersms]
      queues: [[assemble, pack]]
  # POST-HOC after the final evaluation (README decision 20): significance of the char LinearSVM vs the
  # published methods from the saved test predictions of smishfuse-final-settings. CPU, no training.
  smishfuse-final-posthoc:
    accelerator: none
    pip: requirements
    spec:
      kind: stress
      script: src/final/cpu.py
      state_from: smishfuse-final-settings
      queues: [[posthoc]]
  # Step 6: Kazakhstan case study, frozen final models (weights of smishfuse-final-3class), CPU only.
  smishfuse-step6:
    accelerator: none
    pip: requirements
    kernel_sources: [shapok/smishfuse-final-3class]
    spec:
      kind: stress
      script: src/step6/run.py
      queues: [[run]]
  # Step 6b, POST-HOC (README decision 21): sentence-wise NLLB translation of the case-study messages.
  smishfuse-step6b-mt:
    accelerator: none
    pip: requirements
    kernel_sources: [shapok/smishfuse-final-3class]
    spec:
      kind: stress
      script: src/step6/mt_sentence.py
      queues: [[run]]

