# Step 5a: what the papers report. Every number here is FROM THE PAPER (из статьи), copied as
# printed; none was computed by us. "not stated" = the paper does not say it. Checked 2026-10-30.
# Our re-implementations and their results are in results/step5a/published/ (separate on purpose).

on_mendeley:   # results reported on Mendeley SMS Phishing (DOI 10.17632/f45bkkt8pr.1)
  mahmud2024:
    citation: "Mahmud T., Prince M.A.H., Ali M.H., Hossain M.S., Andersson K. Enhancing Cybersecurity:
      Hybrid Deep Learning Approaches to Smishing Attack Detection. Systems 2024, 12(11), 490.
      doi:10.3390/systems12110490"
    full_text: "https://ltu.diva-portal.org/smash/get/diva2:1919310/FULLTEXT01.pdf (read)"
    dataset: "Dataset 3 = Hugging Face ealvaradob/phishing-dataset, 5971 SMS originally ham / smishing /
      spam, cited as Mishra & Soni [10, 33]; regrouped into binary: ham 4844, smishing 1127 (spam + smishing)"
    split: "75% / 10% / 15% train / validation / test, divided randomly; stratification not stated"
    deduplication: not stated
    positive_class_of_P_R_F1: not stated
    method: "stop words and punctuation removed, lowercase, NLTK tokenization, Word2Vec 100-d, Embedding ->
      Conv1D(32, kernel 3, ReLU) -> MaxPooling(2) -> BiGRU(64, dropout 0.2, recurrent dropout 0.2) ->
      Dense(1, sigmoid); binary cross-entropy, Adam, batch 128, 50 epochs (Keras)"
    not_stated: [Word2Vec window / min_count / algorithm / corpus, sequence length, padding side,
                 stop-word list, learning rate, early stopping, embedding trainable or frozen]
    reproducible: "yes, with the unstated settings chosen by us (configs/step5a.yaml)"
    reported_table7_dataset3:   # Accuracy, Precision, Recall, F1, AUC-ROC (test of Dataset 3)
      CNN-BiGRU: {accuracy: 0.9817, precision: 0.9813, recall: 0.9619, f1: 0.9715, auc_roc: 0.9975}
      CNN-GRU: {accuracy: 0.9763, precision: 0.9771, recall: 0.9756, f1: 0.9764, auc_roc: 0.9972}
      BiLSTM: {accuracy: 0.9717, precision: 0.9654, recall: 0.9787, f1: 0.9720, auc_roc: 0.9961}
      Random Forest: {accuracy: 0.9564, precision: 0.9658, recall: 0.9466, f1: 0.9561, auc_roc: 0.9565}
      SVM: {accuracy: 0.8372, precision: 0.8234, recall: 0.8598, f1: 0.8412, auc_roc: 0.8371}

  shim2024:
    citation: "Shim H.S., Park H., Lee K., Park J.-S., Kang S. A Persuasion-Based Prompt Learning Approach
